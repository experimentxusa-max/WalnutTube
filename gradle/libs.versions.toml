[versions]
kotlin = "2.0.20"
agp = "8.5.2"
gradle = "8.7"
composeBom = "2024.08.00"
activity = "1.9.0"
lifecycle = "2.8.2"
navigation = "2.8.2"
hilt = "2.52"
hiltAndroidX = "1.3.0"
okhttp = "4.12.0"
newpipeExtractor = "0.27.1"
junit = "4.13.2"
mockk = "1.13.13"
espresso = "3.5.1"
coreTesting = "1.6.0"
appcompat = "1.7.0"
desugar = "2.0.4"

[libraries]
# Compose - BOM manages versions
compose-bom = { module = "androidx.compose:compose-bom", version.ref = "composeBom" }
compose-ui = { module = "androidx.compose.ui:ui" }
compose-material3 = { module = "androidx.compose.material3:material3" }
compose-navigation = { module = "androidx.navigation:navigation-compose", version.ref = "navigation" }
compose-runtime-livedata = { module = "androidx.compose.runtime:runtime-livedata" }
activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activity" }
lifecycle-viewmodel-compose = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "lifecycle" }
lifecycle-runtime-ktx = { module = "androidx.lifecycle:lifecycle-runtime-ktx", version.ref = "lifecycle" }
lifecycle-runtime-compose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "lifecycle" }
material-icons-extended = { module = "androidx.compose.material:material-icons-extended" }
appcompat = { module = "androidx.appcompat:appcompat", version.ref = "appcompat" }

# Hilt - Dagger (Phase B)
# hilt-android = { module = "com.google.dagger:hilt-android", version.ref = "hilt" }
# hilt-compiler = { module = "com.google.dagger:hilt-compiler", version.ref = "hilt" }

# Hilt - AndroidX (Phase B)
# hilt-lifecycle-viewmodel-compose = { module = "androidx.hilt:hilt-lifecycle-viewmodel-compose", version.ref = "hiltAndroidX" }

# Networking (Phase C)
# okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }
# okhttp-logging = { module = "com.squareup.okhttp3:logging-interceptor", version.ref = "okhttp" }

# NewPipeExtractor (Phase D)
# newpipe-extractor = { module = "com.github.TeamNewPipe:NewPipeExtractor", version.ref = "newpipeExtractor" }

# Core library desugaring (Phase C)
# desugar-jdk-libs = { module = "com.android.tools:desugar_jdk_libs_nio", version.ref = "desugar" }

# Testing
junit = { module = "junit:junit", version.ref = "junit" }
mockk = { module = "io.mockk:mockk", version.ref = "mockk" }
espresso-core = { module = "androidx.test.espresso:espresso-core", version.ref = "espresso" }
compose-test-junit4 = { module = "androidx.compose.ui:ui-test-junit4" }
compose-test-manifest = { module = "androidx.compose.ui:ui-test-manifest" }
core-testing = { module = "androidx.test:core", version.ref = "coreTesting" }
core-testing-ktx = { module = "androidx.test:core-ktx", version.ref = "coreTesting" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
# hilt = { id = "com.google.dagger.hilt.android", version.ref = "hilt" }
kotlin-kapt = { id = "org.jetbrains.kotlin.kapt", version.ref = "kotlin" }